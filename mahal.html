<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our 1st Monthsary 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:wght@400;700&family=Cinzel:wght@400&display=swap" rel="stylesheet">
    <style>
        /* Global Coquette Theme Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Playfair Display', serif;
            background: linear-gradient(135deg, #ffeef8 0%, #f8d7e3 50%, #ffd1dc 100%);
            color: #4a2c3a;
            overflow-x: hidden;
            min-height: 100vh;
        }
        /* Decorative Elements */
        .bow {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #ff69b4;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            transform: rotate(-45deg);
            z-index: 10;
        }
        .bow::before, .bow::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 50px;
            background: #ff1493;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        .bow::before {
            transform: rotate(90deg) translate(25px, -25px);
        }
        .bow::after {
            transform: rotate(-90deg) translate(-25px, -25px);
        }
        .lace-border {
            border: 2px dashed #ffb6c1;
            border-radius: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            position: relative;
        }
        .lace-border::before {
            content: '✿';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #ff69b4;
        }
        /* Heart Animation */
        .heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            color: #ff1493;
            cursor: pointer;
            animation: pulse 2s infinite;
            z-index: 5;
            transition: transform 0.3s ease;
        }
        .heart:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        .heart-clicked {
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, -50%) translateY(0); }
            40% { transform: translate(-50%, -50%) translateY(-20px); }
            60% { transform: translate(-50%, -50%) translateY(-10px); }
        }
        /* Navigation Menu */
        .menu {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 182, 193, 0.95);
            z-index: 20;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .menu.show {
            display: flex;
        }
        .menu h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3em;
            color: #ff1493;
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .menu a {
            display: block;
            margin: 20px;
            padding: 15px 30px;
            background: #fff;
            color: #ff69b4;
            text-decoration: none;
            font-size: 1.5em;
            border-radius: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }
        .menu a:hover {
            background: #ff69b4;
            color: #fff;
            transform: scale(1.05);
        }
        .menu a::before {
            content: '💕';
            margin-right: 10px;
        }
        /* Front Page */
        .front-page {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .front-page h1 {
            position: absolute;
            top: 20%;
            font-family: 'Dancing Script', cursive;
            font-size: 4em;
            color: #ff1493;
            text-align: center;
            z-index: 1;
        }
        /* Sub-Page Styles */
        .sub-page {
            display: none;
            min-height: 100vh;
            padding: 50px 20px;
            text-align: center;
            position: relative;
        }
        .sub-page.show {
            display: block;
        }
        .sub-page h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3em;
            color: #ff1493;
            margin-bottom: 30px;
        }
        /* Photos Page */
        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .photo-placeholder {
            width: 100%;
            height: 300px;
            background: #fff;
            border: 3px solid #ffb6c1;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            color: #ff69b4;
            position: relative;
            overflow: hidden;
        }
        .photo-placeholder::before {
            content: 'Insert Photo Here 💕';
            z-index: 0; /* keep the hint behind actual images */
        }
        .photo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2; /* ensure images appear above the hint */
        }
        /* Uploader styles */
        .uploader {
            margin: 20px auto 30px;
            max-width: 800px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .uploader input[type="file"] {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px dashed #ffb6c1;
            background: #fff;
            cursor: pointer;
        }
        /* Song Page */
        .song-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .song-container iframe {
            width: 100%;
            height: 400px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        /* Letter Page */
        .letter-paper {
            max-width: 600px;
            margin: 50px auto;
            background: #fff;
            padding: 40px;
            border: 2px solid #ffb6c1;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
            font-family: 'Cinzel', serif;
            line-height: 1.6;
            font-size: 1.1em;
            color: #4a2c3a;
            min-height: 400px;
            text-align: left;
        }
        .letter-paper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(to right, #ff69b4, #ffb6c1, #ff69b4);
            border-radius: 10px 10px 0 0;
        }
        .letter-paper::after {
            content: '📜';
            position: absolute;
            top: -10px;
            right: 20px;
            font-size: 2em;
        }
        /* Back Button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #ff69b4;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Dancing Script', cursive;
            font-size: 1.2em;
            z-index: 15;
            text-decoration: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .back-btn:hover {
            background: #ff1493;
        }
        /* Responsive */
        @media (max-width: 768px) {
            .heart { font-size: 60px; }
            .menu h1 { font-size: 2em; }
            .sub-page h1 { font-size: 2em; }
            .photos-grid { grid-template-columns: 1fr; }
            .letter-paper { font-size: 1em; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Front Page -->
    <div class="front-page" id="frontPage">
        <h1>Happy 14th Monthsary mahal 💕</h1>
        <div class="heart" id="heart">💖</div>
        <!-- Decorative Bows -->
        <div class="bow" style="top: 10%; left: 10%;"></div>
        <div class="bow" style="top: 10%; right: 10%; transform: rotate(45deg);"></div>
        <div class="bow" style="bottom: 10%; left: 10%;"></div>
        <div class="bow" style="bottom: 10%; right: 10%; transform: rotate(45deg);"></div>
    </div>

    <!-- Navigation Menu (appears on heart click) -->
    <div class="menu" id="menu">

        <a onclick="showSection('photos')">Our Photos 📸</a>

            <div class="photo-placeholder"><img src="..https://scontent.fmnl17-2.fna.fbcdn.net/v/t1.15752-9/633739746_1904129473529795_5186069731916155220_n.jpg?_nc_cat=111&ccb=1-7&_nc_sid=9f807c&_nc_eui2=AeFvIPn-N7IJsWfW099ntHhBaXNGBTRa5O1pc0YFNFrk7YMmcGQ07x2Y9umodMPS-Ha5S-H82Fccf6XWKvUwFPqR&_nc_ohc=E8cb2kGCve8Q7kNvwHdksTi&_nc_oc=Adn_mgoNw6BBbHgbMvENMRD0-qLig6Mi_OC6zpuhHmWGgOsx2F89UuvOL-Bs3nosDGw&_nc_zt=23&_nc_ht=scontent.fmnl17-2.fna&oh=03_Q7cD4gGAzi9NRFJHT3e-tgeett_mQFBM64rabG03JQnAkgha0Q&oe=69B67245&dl=1" alt="Our Photo 2"></div>

        <!-- Decorative Bows -->
        <div class="bow" style="top: 10%; left: 10%;"></div>
        <div class="bow" style="top: 10%; right: 10%; transform: rotate(45deg);"></div>
    </div>

    <!-- Song Section -->
    <div class="sub-page" id="song">
        <a onclick="showMenu()" class="back-btn">💕 Back</a>
        <h1>Our Song 💕</h1>
        <div class="song-container">

        <div class="bow" style="top: 10%; right: 10%; transform: rotate(45deg);"></div>
    </div>

    <script>
        const heart = document.getElementById('heart');
        const menu = document.getElementById('menu');
        const frontPage = document.getElementById('frontPage');

        heart.addEventListener('click', () => {
            heart.classList.add('heart-clicked');
            setTimeout(() => {
                frontPage.style.display = 'none';
                menu.classList.add('show');
            }, 500);
        });

        function showSection(sectionId) {
            menu.classList.remove('show');
            document.querySelectorAll('.sub-page').forEach(page => page.classList.remove('show'));
            document.getElementById(sectionId).classList.add('show');
        }

        function showMenu() {
            document.querySelectorAll('.sub-page').forEach(page => page.classList.remove('show'));
            frontPage.style.display = 'none';
            menu.classList.add('show');
        }

        function showFrontPage() {
            menu.classList.remove('show');
            document.querySelectorAll('.sub-page').forEach(page => page.classList.remove('show'));
            frontPage.style.display = 'flex';
            heart.classList.remove('heart-clicked');
        }
    </script>

    <script>
        // Photos uploader: preview selected images into the gallery
        (function() {
            const input = document.getElementById('photoInput');
            const grid = document.getElementById('photosGrid');

            function createPhotoElement(src, name) {
                const wrapper = document.createElement('div');
                wrapper.className = 'photo-placeholder';

                const img = document.createElement('img');
                img.src = src;
                img.alt = name || 'Our photo';

                // Remove the ::before hint when an image is present
                wrapper.appendChild(img);

                // Click to remove (free to re-add)
                wrapper.addEventListener('click', () => {
                    // Revoke object URL if applicable
                    if (src.startsWith('blob:')) URL.revokeObjectURL(src);
                    wrapper.remove();
                });

                return wrapper;
            }

            input.addEventListener('change', (e) => {
                const files = Array.from(e.target.files || []);
                if (!files.length) return;

                files.forEach(file => {
                    if (!file.type.startsWith('image/')) return;
                    const objectUrl = URL.createObjectURL(file);
                    const el = createPhotoElement(objectUrl, file.name);
                    grid.appendChild(el);
                });

                // Clear input so same file can be re-selected later
                input.value = '';
            });
        })();
    </script>

</body>

</html>
